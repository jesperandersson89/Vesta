name: Build examples

# Builds every example against the PUBLISHED SDK packages, exactly as a user who copies one out would.
# Independent of build.yml/release.yml so it can be re-run on its own (Actions > Build examples > Run workflow).
#   sdk_version empty    -> use the versions pinned in each example's manifest
#   sdk_version "latest" -> newest published version on NuGet / npm / PyPI
#   sdk_version "X.Y.Z"  -> that version (nothing is committed; the override only applies to the runner)

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'SDK version override (empty = manifest pins, "latest", or X.Y.Z)'
        required: false
        default: ''
  workflow_run:
    workflows: ['Release SDK packages']
    types: [completed]
  pull_request:
    paths:
      - 'examples/**'
      - '.github/workflows/examples.yml'

permissions:
  contents: read

env:
  # After a release, pin to the tag (vX.Y.Z) rather than "latest": registries lag behind the publish.
  SDK_VERSION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.sdk_version }}

jobs:
  csharp:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [ChatRoom.CLI, TodoList.CLI, Presence.CLI]
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Override SDK version
        if: ${{ env.SDK_VERSION != '' }}
        run: |
          SDK_VERSION="${SDK_VERSION#v}"
          if [ "$SDK_VERSION" = "latest" ]; then
            dotnet add examples/${{ matrix.example }} package VestaProtocol.Client
          else
            for i in $(seq 1 10); do
              dotnet add examples/${{ matrix.example }} package VestaProtocol.Client --version "$SDK_VERSION" && exit 0
              sleep 30
            done
            exit 1
          fi

      - name: Build
        run: dotnet build examples/${{ matrix.example }} --configuration Release

  typescript:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [chess-web, clipboard-ts]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install
        run: npm ci

      - name: Override SDK version
        if: ${{ env.SDK_VERSION != '' }}
        run: |
          SDK_VERSION="${SDK_VERSION#v}"
          for i in $(seq 1 10); do
            npm install --no-save "vesta-client@$SDK_VERSION" && exit 0
            sleep 30
          done
          exit 1

      - name: Build
        run: npm run build

  python:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [colorwheel-py, collab-edit-py]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install
        working-directory: examples/${{ matrix.example }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Override SDK version
        if: ${{ env.SDK_VERSION != '' }}
        run: |
          SDK_VERSION="${SDK_VERSION#v}"
          if [ "$SDK_VERSION" = "latest" ]; then
            pip install --upgrade vesta-client
          else
            for i in $(seq 1 10); do
              pip install "vesta-client==$SDK_VERSION" && exit 0
              sleep 30
            done
            exit 1
          fi

      - name: Byte-compile
        run: python -m compileall -q examples/${{ matrix.example }}
