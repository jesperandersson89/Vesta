name: Release relay image

# Publishes ghcr.io/<owner>/vesta-server for RELAY OPERATORS. Versioned independently of the
# SDK packages (release.yml / vX.Y.Z): this workflow runs on server-vX.Y.Z tags only.
# Nothing here deploys anything — operators (e.g. Atrium) pull and pin the tag themselves.

on:
  push:
    tags:
      - 'server-v*'

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#server-v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not server-vX.Y.Z" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: dotnet test (server + core)
        run: |
          dotnet test tests/VestaCore.Tests/VestaCore.Tests.csproj --configuration Release
          dotnet test tests/VestaServer.Tests/VestaServer.Tests.csproj --configuration Release

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/vesta-server
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.value, '-') }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/VestaServer/Dockerfile
          push: true
          build-args: VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
