name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Build
        run: dotnet build src/VestaServer/VestaServer.csproj --configuration Release

      # Test projects only: examples are built by examples.yml against the published packages.
      - name: Run tests
        run: |
          dotnet test tests/VestaCore.Tests/VestaCore.Tests.csproj --configuration Release
          dotnet test tests/VestaClient.Tests/VestaClient.Tests.csproj --configuration Release
          dotnet test tests/VestaServer.Tests/VestaServer.Tests.csproj --configuration Release

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR (main only)
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/vesta-server
          tags: |
            type=sha,prefix=sha-

      # PRs only verify the image builds; main also publishes :sha-<short> (never :latest).
      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/VestaServer/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
