# LOCAL DEVELOPMENT RELAY ONLY — open mode, throwaway credentials, no TLS.
# This is how you get a relay to develop an app against; it is NOT how you host one for
# others. Relay operators: see docs/operating-a-relay.md.
#
#   docker compose up --build        # relay on ws://localhost:5150/ws

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vesta
      POSTGRES_USER: vesta
      POSTGRES_PASSWORD: vesta
    volumes:
      - vesta-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vesta -d vesta"]
      interval: 3s
      timeout: 3s
      retries: 20

  relay:
    build:
      context: .
      dockerfile: src/VestaServer/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5150:8080"
    environment:
      ConnectionStrings__Vesta: "Host=postgres;Database=vesta;Username=vesta;Password=vesta"
      Protocol__RequireAppRegistration: "false"

volumes:
  vesta-pg:
