<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="color-scheme" content="light" />
    <title>Vesta relay admin</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="page">
        <a class="wordmark" href="#/overview">Vesta <span>relay admin</span></a>
        <nav class="nav" id="nav" hidden>
          <a class="nav-link" data-section="overview" href="#/overview">Overview</a>
          <a class="nav-link" data-section="apps" href="#/apps">Apps</a>
          <a class="nav-link" data-section="channels" href="#/channels">Channels</a>
          <a class="nav-link" data-section="alerts" href="#/alerts"
            >Alerts<span class="badge badge-warning nav-badge" id="alertBadge" hidden>0</span></a
          >
          <a class="nav-link" data-section="audit" href="#/audit">Audit</a>
        </nav>
        <button class="btn btn-ghost btn-sm" id="logoutBtn" hidden>Sign out</button>
      </div>
    </header>

    <main id="loginView" class="login-wrap" hidden>
      <div class="card">
        <div class="card-header">Sign in</div>
        <div class="card-body">
          <div class="field">
            <label class="label" for="seedInput">Admin private key</label>
            <textarea
              class="input"
              id="seedInput"
              rows="3"
              autocomplete="off"
              spellcheck="false"
              placeholder="base64url-encoded 32-byte seed"
            ></textarea>
            <span class="hint"
              >The key is used to sign a one-time challenge in this page and is never sent to the
              relay. Its public key must be listed in <code>Admin:BootstrapPublicKeys</code>.</span
            >
          </div>
          <button class="btn btn-primary" id="loginBtn">Sign in</button>
          <p class="error-text" id="loginError"></p>
        </div>
      </div>
    </main>

    <main id="app" class="page" hidden>
      <div id="content"></div>
    </main>

    <footer class="site-footer">
      <div class="page">
        <span>Vesta relay admin</span>
        <span id="footerStatus">Not signed in</span>
      </div>
    </footer>

    <script type="module" src="admin.js"></script>
  </body>
</html>
